# ═══════════════════════════════════════════════════════
# docker-compose.prod.yml — 2 инстанса app + Nginx LB
# Запуск: docker compose -f docker-compose.prod.yml up --build
# ═══════════════════════════════════════════════════════

services:
  # ═══ Nginx Load Balancer ═══
  nginx:
    image: nginx:1.25-alpine
    container_name: treserve-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
    restart: unless-stopped

  # ═══ Frontend ═══
  frontend:
    build: ./frontend
    container_name: treserve-frontend
    ports:
      - "80:80"
    depends_on:
      - nginx
    restart: unless-stopped

  # ═══ MinIO (S3-compatible storage для PDF) ═══
  minio:
    image: minio/minio:latest
    container_name: treserve-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ═══ App Instance 1 ═══
  app-1:
    build: .
    container_name: treserve-app-1
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/treserve
      SPRING_DATASOURCE_USERNAME: treserve
      SPRING_DATASOURCE_PASSWORD: treserve_dev
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: tickets
      INSTANCE_ID: app-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ═══ App Instance 2 ═══
  app-2:
    build: .
    container_name: treserve-app-2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/treserve
      SPRING_DATASOURCE_USERNAME: treserve
      SPRING_DATASOURCE_PASSWORD: treserve_dev
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: tickets
      INSTANCE_ID: app-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ═══ PostgreSQL ═══
  postgres:
    image: postgres:16-alpine
    container_name: treserve-postgres
    environment:
      POSTGRES_DB: treserve
      POSTGRES_USER: treserve
      POSTGRES_PASSWORD: treserve_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treserve"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══ Redis (shared cache — оба инстанса используют один Redis) ═══
  redis:
    image: redis:7-alpine
    container_name: treserve-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══ RabbitMQ ═══
  rabbitmq:
    build: ./rabbitmq
    container_name: treserve-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  pg_data:
  minio_data:
