<article class="event-card animate-fade-in" (click)="openEvent()">
  <div class="event-poster-wrapper">
    <div class="event-poster skeleton" 
         [ngClass]="'poster-bg-' + ((event.id % 6) + 1)"
         [style.background-image]="event.imageUrl ? 'url(' + event.imageUrl + ')' : ''"></div>
    <div class="date-badge">
      <span class="date-day">{{ event.startTime | date:'d' }}</span>
      <span class="date-month">{{ event.startTime | date:'LLL' }}</span>
    </div>
  </div>
  
  <div class="event-copy">
    <div class="event-meta-line">
      <span class="category-tag">{{ event.category }}</span>
      <span class="age-limit">{{ event.ageRestriction }}</span>
    </div>
    
    <h3 class="event-title">{{ event.title }}</h3>
    <p class="event-description" *ngIf="event.description">{{ event.description }}</p>
    
    <div class="event-footer-line">
      <span class="venue-label">
        <span class="map-icon">📍</span>{{ event.venue?.name || event.venueName }}
      </span>
      <span class="price-badge">от {{ event.basePrice }} ₽</span>
    </div>
  </div>
</article>
