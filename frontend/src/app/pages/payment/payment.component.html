<section class="shell payment-page">

  <button type="button" class="back-button" (click)="goBack()">
    ← Назад
  </button>

  <div class="payment-header">
    <h1>Оплата выбранных билетов</h1>

    <p class="seat-info">
      Выбрано мест:
      {{ selectedSeat ? '1. ' + selectedSeat.seatLabel : '0' }}
    </p>
  </div>

  <div *ngIf="errorMessage" class="error-box">
    {{ errorMessage }}
  </div>

  <div *ngIf="isLoading" class="loader">
    Бронируем место...
  </div>

  <div class="payment-card">
    <h2>Выберите способ оплаты</h2>

    <button
      class="payment-action"
      type="button"
      (click)="payFree()"
      [disabled]="isLoading || !lockId"
    >
      Купить бесплатно
    </button>

    <div class="timer-row">
      Осталось: {{ expiresLabel }}
    </div>
  </div>

</section>
