<section class="shell admin-page">
  <div class="notification" *ngIf="notification">
    {{ notification }}
  </div>
  <div class="admin-top animate-fade-in">
    <h1>Ваши события</h1>
    <a routerLink="/admin/create" class="action-chip" style="font-size: 1rem; padding: 0.75rem 1.25rem;">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Добавить событие
    </a>
    <button class="action-chip" (click)="openCheckIn()">
      Проверка id билета
    </button>

    <button class="action-chip" (click)="startScanner()">
      QR Сканер
    </button>
  </div>
  <div class="admin-list animate-slide-up">
    <div class="admin-row" *ngFor="let event of events">
      <div class="event-main">
        <h2>{{ event.title }}</h2>
        <span>{{ event.nextSession| date:'d MMMM HH:mm' }}</span>
      </div>

      <div class="admin-actions">
        <button class="icon-btn edit" [routerLink]="['/admin/create', event.id]" title="Редактировать">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
        </button>

        <button class="icon-btn delete" (click)="delete(event.id)" title="Удалить">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="created-modal" *ngIf="showCreatedModal">
    <div class="created-card">
      <h3>Событие добавлено</h3>
      <button type="button">Закрыть</button>
    </div>
  </div>
  <div class="created-modal" *ngIf="showCheckIn">
    <div class="created-card">

      <h2>Check-in</h2>

      <h4>По ID билета</h4>
      <input type="number" [(ngModel)]="ticketId" placeholder="Ticket ID" />
      <button (click)="checkInById()">Подтвердить</button>

      <hr />

      <h4>По QR токену</h4>
      <input type="text" [(ngModel)]="token" placeholder="QR token" />
      <button (click)="checkInByToken()">Сканировать</button>

      <hr />

      <div *ngIf="checkInMessage" class="checkin-result">
        <pre>{{ checkInMessage }}</pre>
      </div>

      <button (click)="closeCheckIn()">Закрыть</button>

    </div>
  </div>
  <div class="created-modal" *ngIf="showScanner">
    <div class="created-card">

      <h2>QR Scanner</h2>

      <div id="qr-reader" style="width: 100%"></div>

      <button (click)="closeScanner()">Закрыть</button>

    </div>
  </div>
</section>
