<section class="shell admin-page">
  <div class="admin-top animate-fade-in">
    <h1>Ваши события</h1>
    <a routerLink="/admin/create" class="action-chip" style="font-size: 1rem; padding: 0.75rem 1.25rem;">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Добавить событие
    </a>
  </div>
  <div class="admin-list animate-slide-up">
    <div class="admin-row clickable-card" *ngFor="let event of events" [routerLink]="['/admin/events', event.id]">
      <div class="event-main">
        <h2>{{ event.title }}</h2>
        <span>{{ event.nextSession| date:'d MMMM HH:mm' }}</span>
      </div>

      <div class="admin-actions" (click)="$event.stopPropagation()">
        <button class="icon-btn edit" [routerLink]="['/admin/create', event.id]" title="Редактировать">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
        </button>

        <button class="icon-btn delete" (click)="delete(event.id)" title="Удалить">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
