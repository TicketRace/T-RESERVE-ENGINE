<section class="auth-page">
  <div class="auth-card">

    <h1>{{ mode === 'login' ? 'Вход' : 'Регистрация' }}</h1>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <input
        *ngIf="mode === 'register'"
        type="text"
        formControlName="name"
        placeholder="Имя (необязательно)"
      />
      <div class="error" *ngIf="form.get('name')?.errors?.['maxlength']">
        Максимум 100 символов
      </div>

      <input
        type="email"
        formControlName="email"
        placeholder="Email"
      />
      <div class="error" *ngIf="form.get('email')?.touched && form.get('email')?.errors">
        Некорректный email
      </div>

      <div class="password-wrapper">
        <input
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password"
          placeholder="Пароль"
        />
        <button
        type="button"
        (click)="togglePassword()"
        [style.opacity]="form.get('password')?.value ? 1 : 0.4"
      >
        👁
      </button>
      </div>

      <div class="error" *ngIf="form.get('password')?.touched">
        <span *ngIf="form.get('password')?.errors?.['required']">
          Пароль обязателен
        </span>
        <span *ngIf="form.get('password')?.errors?.['minlength']">
          Минимум 6 символов
        </span>
        <span *ngIf="form.get('password')?.errors?.['maxlength']">
          Максимум 100 символов
        </span>
      </div>

      <div *ngIf="error" class="error">
        {{ error }}
      </div>

      <button class="main-btn" type="submit" [disabled]="form.invalid">
        {{ mode === 'login' ? 'Войти' : 'Зарегистрироваться' }}
      </button>

      <a *ngIf="mode === 'login'" routerLink="/register">
        Создать аккаунт
      </a>

      <a *ngIf="mode === 'register'" routerLink="/login">
        Уже есть аккаунт?
      </a>

    </form>

    <div class="divider"><span>или</span></div>

    <button class="google-btn" type="button" (click)="googleLogin()">
      <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Войти через Google
    </button>

  </div>
</section>
