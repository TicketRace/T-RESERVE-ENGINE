spring:
  application:
    name: t-reserve-engine

  # ═══ PostgreSQL ═══
  datasource:
    url: jdbc:postgresql://localhost:5432/treserve
    username: treserve
    password: treserve_dev
    hikari:
      maximum-pool-size: 20

  # ═══ JPA ═══
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true

  # ═══ Flyway ═══
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ═══ Redis ═══
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16

  # ═══ RabbitMQ ═══
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # ═══ Virtual Threads (Java 21) ═══
  threads:
    virtual:
      enabled: true

# ═══ App Settings ═══
app:
  jwt:
    secret: ${JWT_SECRET:t-reserve-super-secret-key-change-in-prod-256-bits-minimum}
    expiration-ms: 86400000       # 24 hours (access token)
    refresh-expiration-ms: 604800000  # 7 days (refresh token)
  booking:
    lock-duration-minutes: 10
  cache:
    default-ttl-seconds: 30
    seats-ttl-seconds: 10
    events-ttl-seconds: 60
  qr:
    base-url: https://t-reserve.ru/verify-ticket
    # base-url: http://localhost:8080/api/tickets/public

# ═══ Swagger ═══
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# ═══ Actuator ═══
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# ═══ Logging ═══
logging:
  level:
    com.treserve: DEBUG
    org.springframework.security: DEBUG

# ═══ Error details ═══
server:
  error:
    include-message: always
    include-stacktrace: on_param

# ═══ MinIO (S3-compatible storage) ═══
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:tickets}
  region: us-east-1

# ═══ PDF Generation ═══
pdf:
  base-url: http://localhost:8081/api/tickets