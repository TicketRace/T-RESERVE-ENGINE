spring:
  application:
    name: t-reserve-engine

  # ═══ PostgreSQL ═══
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/treserve}
    username: ${DATABASE_USERNAME:treserve}
    password: ${DATABASE_PASSWORD:treserve_dev}
    hikari:
      maximum-pool-size: 20

  # ═══ JPA ═══
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true

  # ═══ Flyway ═══
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ═══ Redis ═══
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16

  # ═══ RabbitMQ ═══
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # ═══ Virtual Threads (Java 21) ═══
  threads:
    virtual:
      enabled: true

# ═══ App Settings ═══
app:
  jwt:
    secret: ${JWT_SECRET:t-reserve-super-secret-key-change-in-prod-256-bits-minimum}
    expiration-ms: 900000          # 15 min (access token) — ранее 24h, уменьшено для безопасности
    refresh-expiration-ms: 604800000  # 7 days (refresh token)
  booking:
    lock-duration-minutes: 10
  cache:
    default-ttl-seconds: 30
    seats-ttl-seconds: 10
    events-ttl-seconds: 60
  qr:
    base-url: https://t-reserve.ru/verify-ticket
    # base-url: http://localhost:8080/api/tickets/public

# ═══ Swagger ═══
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# ═══ Actuator + Prometheus ═══
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      instance: ${INSTANCE_ID:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true  # p50/p95/p99 latency гистограмма
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s

# ═══ Logging ═══
logging:
  level:
    com.treserve: DEBUG
    org.springframework.security: DEBUG

# ═══ CORS ═══
# Разрешенные CORS origins. Для продакшена (например, на Railway) переопределяется через переменную окружения CORS_ALLOWED_ORIGINS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000,http://localhost}
# ═══ Server ═══
server:
  port: ${PORT:8080}   # Railway задаёт PORT автоматически; локально — 8080
  error:
    include-message: always
    include-stacktrace: never    # never в проде — не светим стектрейсы

# ═══ MinIO (S3-compatible storage) ═══
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:tickets}
  region: ${MINIO_REGION:us-east-1}

# ═══ PDF Generation ═══
pdf:
  base-url: ${PDF_BASE_URL:http://localhost:8081/api/tickets}
