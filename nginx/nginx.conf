upstream treserve_backend {
    # Round-robin по умолчанию — запросы чередуются между инстансами
    server app-1:8080;
    server app-2:8080;
}

# Логирование — видно какой upstream ответил
log_format upstream_log '$remote_addr - $upstream_addr - $request - $status';

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log upstream_log;

    location / {
        proxy_pass http://treserve_backend;

        # Прокидываем заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /ws/ {
        proxy_pass http://treserve_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Health check endpoint
    location /nginx-health {
        default_type text/plain;
        return 200 'nginx OK';
    }
}
