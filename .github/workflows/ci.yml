name: CI — Build & Test

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Unit tests
        run: mvn test --batch-mode --no-transfer-progress

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check Docker availability
        run: docker info

      - name: Integration tests
        run: mvn verify -P integration-tests --batch-mode --no-transfer-progress

  frontend-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run mocked Playwright E2E tests
        working-directory: frontend
        run: npm run e2e:mocked

  frontend-real-e2e:
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend dependencies
        run: docker compose up -d postgres redis rabbitmq

      - name: Start Spring Boot backend
        run: |
          mvn --batch-mode --no-transfer-progress -pl treserve-app -am spring-boot:run > backend.log 2>&1 &
          echo $! > backend.pid

          for i in {1..90}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done

          echo "Backend did not start in time"
          cat backend.log
          exit 1

      - name: Run real Playwright E2E tests
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8080
        run: npm run e2e:real

      - name: Print backend logs on failure
        if: failure()
        run: cat backend.log || true

      - name: Stop backend and infrastructure
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi
          docker compose down -v
