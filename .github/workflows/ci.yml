name: CI — Build & Test

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Unit tests
        run: mvn test --batch-mode --no-transfer-progress

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check Docker availability
        run: docker info

      - name: Integration tests
        run: mvn verify -P integration-tests --batch-mode --no-transfer-progress

  frontend-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        env:
          NG_CLI_ANALYTICS: "false"
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run mocked Playwright E2E tests
        working-directory: frontend
        env:
          NG_CLI_ANALYTICS: "false"
        run: npm run e2e:mocked

      - name: Upload mocked Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mocked
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload mocked Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-mocked
          path: frontend/test-results
          if-no-files-found: ignore

  frontend-real-e2e:
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["develop", "main", "feat/e2e-tests"]'), github.ref_name) || contains(fromJSON('["develop", "feat/e2e-tests"]'), github.head_ref)
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Configure Docker layer cache for production compose
        run: |
          cat > docker-compose.ci-cache.yml <<'EOF'
          services:
            frontend:
              build:
                context: ./frontend
                cache_from:
                  - type=gha,scope=treserve-frontend-prod
                cache_to:
                  - type=gha,mode=max,scope=treserve-frontend-prod
            app-1:
              build:
                context: .
                cache_from:
                  - type=gha,scope=treserve-backend-prod
                cache_to:
                  - type=gha,mode=max,scope=treserve-backend-prod
            app-2:
              build:
                context: .
                cache_from:
                  - type=gha,scope=treserve-backend-prod
                cache_to:
                  - type=gha,mode=max,scope=treserve-backend-prod
          EOF

      - name: Build and start production stack
        run: |
          sed -i 's/"80:80"/"8081:80"/g' docker-compose.prod.yml
          docker compose -f docker-compose.prod.yml -f docker-compose.ci-cache.yml up -d --build

      - name: Wait for frontend nginx and proxied API
        run: |
          for i in {1..120}; do
            if curl -fsS http://localhost:8081/ >/dev/null && \
               curl -fsS 'http://localhost:8081/api/events?page=0&size=1' >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Production stack did not become ready in time"
          docker compose -f docker-compose.prod.yml -f docker-compose.ci-cache.yml ps
          docker compose -f docker-compose.prod.yml -f docker-compose.ci-cache.yml logs --no-color
          exit 1

      - name: Run real Playwright E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8081
          E2E_API_URL: http://localhost:8081
          E2E_SKIP_FRONTEND_SERVER: '1'
          NG_CLI_ANALYTICS: "false"
        run: npm run e2e:real

      - name: Upload real Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real
          path: frontend/playwright-report-real
          if-no-files-found: ignore

      - name: Upload real Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-real
          path: frontend/test-results
          if-no-files-found: ignore

      - name: Print production stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color || true

      - name: Stop production stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
